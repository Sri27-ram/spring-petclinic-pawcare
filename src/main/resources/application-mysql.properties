# database init, supports mysql too
database=mysql
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost/pawcareclinic}
spring.datasource.username=${MYSQL_USER:pawcareclinic}
spring.datasource.password=${MYSQL_PASS:pawcareclinic}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
